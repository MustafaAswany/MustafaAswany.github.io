<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Portfolio Editor · Mustafa Alaswany</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#0c0b0b; --side:#131111; --card:#1b1817; --card2:#221e1d; --line:#2e2826; --line2:#3b3431;
  --fg:#f3eeec; --muted:#9c908b; --dim:#665c58; --accent:#d9544a; --brand:#9e3e39; --blue:#5b9dff; --ok:#46c38a; --warn:#e7b24c;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--body);display:grid;grid-template-rows:56px 1fr;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:var(--fg)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}

/* top bar */
.top{display:flex;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--side);min-width:0}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;white-space:nowrap}
.logo svg{width:28px}
.logo small{display:block;font-weight:500;color:var(--muted);font-size:11px;font-family:var(--mono);letter-spacing:.06em}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg button{padding:5px 10px;border-radius:6px;color:var(--muted);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--card2);color:var(--fg);box-shadow:0 0 0 1px var(--line2)}
.seg svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8}
.grow{flex:1}
.status{font-size:12px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:7px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.status.dirty i{background:var(--warn)} .status.clean i{background:var(--ok)}
.ib{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--muted);border:1px solid transparent}
.ib:hover{background:var(--card);color:var(--fg);border-color:var(--line)}
.ib:disabled{opacity:.35;pointer-events:none}
.ib svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 14px;border-radius:9px;font-weight:700;font-size:13px;border:1px solid var(--line2);background:var(--card);white-space:nowrap}
.btn:hover{border-color:var(--dim)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn.ghost{background:none}
.btn.danger{color:#ff8c84}
.btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* layout */
.app{display:grid;grid-template-columns:470px 1fr;min-height:0}
.side{display:grid;grid-template-columns:76px 1fr;min-height:0;border-right:1px solid var(--line);background:var(--side)}
.tabs{display:flex;flex-direction:column;gap:2px;padding:10px 6px;border-right:1px solid var(--line);overflow-y:auto}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px;border-radius:9px;color:var(--muted);font-size:10.5px;font-weight:600}
.tabs button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs button:hover{color:var(--fg);background:var(--card)}
.tabs button[aria-selected="true"]{color:var(--fg);background:var(--card2);box-shadow:inset 0 0 0 1px var(--line2)}
.tabs button[aria-selected="true"] svg{stroke:var(--accent)}
.panel{overflow-y:auto;padding:18px 16px 80px;min-width:0}
.panel h2{font-size:18px;margin:0 0 4px}
.panel .lead{color:var(--muted);font-size:12.5px;margin:0 0 18px}
.group{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.group > h3{font-size:12px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:500}
.f{display:grid;gap:5px;margin-bottom:12px;min-width:0}
.f:last-child{margin-bottom:0}
.f > label,.lbl{font-size:12px;color:var(--muted);font-weight:600}
.in{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;outline:none;min-width:0}
.in:focus{border-color:var(--blue)}
textarea.in{resize:vertical;min-height:62px;line-height:1.45}
.in[dir="rtl"]{font-family:"IBM Plex Sans Arabic",var(--body)}
.bi{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bi.stack{grid-template-columns:1fr}
.bi .tag{position:relative}
.bi .tag::after{content:attr(data-l);position:absolute;top:7px;inset-inline-end:8px;font:500 9.5px var(--mono);color:var(--dim);pointer-events:none}
.bi .tag .in{padding-inline-end:28px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
.color{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:4px 8px 4px 4px}
.color input[type=color]{width:30px;height:28px;border:0;border-radius:6px;padding:0;background:none;cursor:pointer}
.color input[type=color]::-webkit-color-swatch-wrapper{padding:0}.color input[type=color]::-webkit-color-swatch{border:1px solid rgba(255,255,255,.15);border-radius:6px}
.color .in{border:0;padding:4px 0;font-family:var(--mono);font-size:12.5px;background:none}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;cursor:pointer}
.toggle input{appearance:none;width:36px;height:21px;border-radius:999px;background:var(--line2);position:relative;cursor:pointer;flex:none;transition:.2s}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.2s}
.toggle input:checked{background:var(--accent)}
.toggle input:checked::after{left:18px}
.toggle span small{display:block;color:var(--muted);font-size:11.5px}
.range{display:flex;align-items:center;gap:10px}
.range input{flex:1;accent-color:var(--accent)}
.range output{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:42px;text-align:right}
.presets{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.preset{border-radius:10px;border:1px solid var(--line2);padding:6px;display:grid;gap:5px;text-align:center;font-size:10.5px;color:var(--muted)}
.preset:hover{border-color:var(--dim);color:var(--fg)}
.preset b{display:block;height:28px;border-radius:6px}

/* sortable lists */
.list{display:grid;gap:8px}
.item{background:var(--bg);border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.item.off{opacity:.55}
.ihead{display:flex;align-items:center;gap:8px;padding:7px 8px;min-width:0}
.grip{cursor:grab;color:var(--dim);display:grid;place-items:center;width:20px;height:28px;flex:none;touch-action:none}
.grip:hover{color:var(--fg)}
.grip svg{width:12px;height:18px;fill:currentColor}
.thumb{width:54px;height:36px;border-radius:6px;background:var(--card2) center/cover no-repeat;flex:none}
.ititle{flex:1;min-width:0;cursor:pointer}
.ititle b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ititle small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibody{padding:12px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--card) 60%,var(--bg))}
.mini{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--muted);flex:none}
.mini:hover{background:var(--card2);color:var(--fg)}
.mini.del:hover{color:#ff8c84}
.mini svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sortable-ghost{opacity:.35}
.sortable-chosen .ihead{background:var(--card2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:2px;background:var(--bg);border:1px solid var(--line2);border-radius:999px;padding:2px 4px 2px 2px}
.chip .grip{width:16px;height:22px}
.chip input{background:none;border:0;outline:none;width:auto;min-width:40px;padding:3px 2px;font-size:12.5px}
.chip .mini{width:22px;height:22px}
.add{width:100%;border:1px dashed var(--line2);border-radius:10px;padding:9px;color:var(--muted);font-weight:600;font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px}
.add:hover{color:var(--fg);border-color:var(--dim)}
.add svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}

/* image drop */
.drop{position:relative;border:1.5px dashed var(--line2);border-radius:10px;min-height:110px;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:12px;cursor:pointer;overflow:hidden;background:var(--bg) center/contain no-repeat}
.drop.has{background-size:cover}
.drop.tall{min-height:220px;background-size:contain}
.drop:hover,.drop.over{border-color:var(--blue);color:var(--fg)}
.drop span{background:rgba(12,11,11,.75);padding:6px 10px;border-radius:8px;backdrop-filter:blur(4px)}
.drop.has span{opacity:0;transition:.2s}.drop.has:hover span,.drop.over span{opacity:1}

/* stage */
.stage{position:relative;display:grid;place-items:start center;overflow:auto;background:
  radial-gradient(circle at 1px 1px,#2a2524 1px,transparent 0) 0 0/22px 22px, #0f0e0e;padding:20px;min-width:0}
.device{position:relative;background:#000;border-radius:12px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px var(--line2);overflow:hidden;transform-origin:top center}
.device iframe{border:0;display:block;width:100%;height:100%;background:#0d0b0b}
.device.mobile{border-radius:34px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 10px #1d1a19,0 0 0 11px var(--line2)}
.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(19,17,17,.92);border:1px solid var(--line);color:var(--muted);font-size:12px;padding:7px 12px;border-radius:999px;white-space:nowrap;pointer-events:none}

/* banners, toasts, modal */
.banner{display:flex;gap:10px;align-items:center;background:color-mix(in srgb,var(--warn) 12%,var(--card));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:12.5px}
.banner p{margin:0;flex:1}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;background:var(--card2);border:1px solid var(--line2);padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;z-index:99;transition:.3s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.err{border-color:#a3473f;color:#ffb3ad}
.log{font-family:var(--mono);font-size:11.5px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;white-space:pre-wrap;max-height:200px;overflow:auto;margin-top:10px}
.steps-help{margin:0;padding-inline-start:18px;color:var(--muted);font-size:12.5px;display:grid;gap:6px}
.steps-help b{color:var(--fg)}
.steps-help code{font-family:var(--mono);font-size:11.5px;background:var(--bg);padding:1px 5px;border-radius:4px;color:var(--fg)}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}
.secrow{display:flex;align-items:center;gap:8px;padding:9px 10px}
.secrow b{flex:1}
.secrow.locked{opacity:.7}
.pill{font:500 10px var(--mono);color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:2px 7px}

.lock{position:fixed;inset:0;z-index:200;background:radial-gradient(circle at 50% 30%,#1d1716,#0c0b0b 70%);display:grid;place-items:center;padding:20px}
.lock-box{width:min(380px,100%);background:var(--side);border:1px solid var(--line);border-radius:16px;padding:28px 24px;display:grid;gap:14px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.lock-box svg{width:52px;margin:0 auto}
.lock-box h1{font-size:18px;margin:0}
.lock-box p{margin:0;color:var(--muted);font-size:13px}
.lock-box .err{color:#ff8c84;min-height:18px;font-size:12.5px}
.lock-box .toggle{text-align:start}
body.locked .app,body.locked .top{filter:blur(14px);pointer-events:none;user-select:none}
@media (max-width:980px){
  .app{grid-template-columns:1fr}
  .stage{display:none}
  .app.show-preview .side{display:none}
  .app.show-preview .stage{display:grid}
  .top .hide-sm{display:none}
  #pvToggle{display:inline-flex!important}
}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script>
/* ===================== state ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const LS = { get(k){ try { return localStorage.getItem(k); } catch(_) { return null; } }, set(k,v){ try { localStorage.setItem(k,v); return true; } catch(_) { return false; } }, del(k){ try { localStorage.removeItem(k); } catch(_) {} } };
const DRAFT_KEY = "aswany-editor-draft-v1", GH_KEY = "aswany-editor-github";
let C = null, PUBLISHED = "", PENDING = {}, HIST = [], FUT = [], TAB = "design", OPEN = {}, DEV = "desktop", PLANG = "en";

const get = p => p.split(".").reduce((o,k) => o == null ? o : o[k], C);
function set(p, v){ const ks = p.split("."); let o = C; for (let i=0;i<ks.length-1;i++){ if (o[ks[i]] == null) o[ks[i]] = {}; o = o[ks[i]]; } o[ks.at(-1)] = v; }

let histTimer = null, lastSnap = "";
function changed(opts = {}){
  clearTimeout(histTimer);
  const push = () => { const s = JSON.stringify(C); if (s !== lastSnap) { HIST.push(lastSnap); if (HIST.length > 80) HIST.shift(); FUT = []; lastSnap = s; } updUndo(); saveDraft(); };
  opts.now ? push() : (histTimer = setTimeout(push, 350));
  sendPreview();
  setStatus();
}
function undo(){ if (!HIST.length) return; FUT.push(JSON.stringify(C)); lastSnap = HIST.pop(); C = JSON.parse(lastSnap); afterJump(); }
function redo(){ if (!FUT.length) return; HIST.push(JSON.stringify(C)); lastSnap = FUT.pop(); C = JSON.parse(lastSnap); afterJump(); }
function afterJump(){ updUndo(); saveDraft(); sendPreview(); setStatus(); renderPanel(); }
function updUndo(){ $("#undo").disabled = !HIST.length; $("#redo").disabled = !FUT.length; }

function saveDraft(){
  const s = JSON.stringify(C);
  if (s === PUBLISHED && !Object.keys(PENDING).length) { LS.del(DRAFT_KEY); return; }
  if (!LS.set(DRAFT_KEY, JSON.stringify({C, PENDING, at: Date.now()}))) {
    LS.set(DRAFT_KEY, JSON.stringify({C, PENDING:{}, at: Date.now()}));
  }
}
function setStatus(){
  const dirty = JSON.stringify(C) !== PUBLISHED;
  const el = $("#status"); el.className = "status hide-sm " + (dirty ? "dirty" : "clean");
  el.querySelector("span").textContent = dirty ? "Unpublished changes" : "Up to date with live site";
}
let toastT;
function toast(msg, err){ const t = $("#toast"); t.textContent = msg; t.className = "toast on" + (err ? " err" : ""); clearTimeout(toastT); toastT = setTimeout(() => t.className = "toast" + (err ? " err" : ""), err ? 5200 : 2600); }

/* ===================== preview ===================== */
const pv = $("#pv"); let pvReady = false, pvTimer;
function resolved(){ return JSON.parse(JSON.stringify(C), (k,v) => typeof v === "string" && v.startsWith("pending:") ? (PENDING[v.slice(8)] || "") : v); }
function sendPreview(){ clearTimeout(pvTimer); pvTimer = setTimeout(() => { if (pvReady) pv.contentWindow.postMessage({type:"aswany:content", content: resolved()}, "*"); }, 90); }
addEventListener("message", e => {
  if (e.source !== pv.contentWindow) return;
  const m = e.data || {};
  if (m.type === "aswany:ready") { pvReady = true; sendPreview(); pv.contentWindow.postMessage({type:"aswany:lang", lang: PLANG}, "*"); }

function layoutDevice(){
  const stage = $("#stage"), dev = $("#device");
  const W = {desktop:1440, tablet:820, mobile:390}[DEV], H = {desktop:900, tablet:1100, mobile:844}[DEV];
  const availW = stage.clientWidth - 40, availH = stage.clientHeight - 40;
  const s = Math.min(1, availW / W, DEV === "desktop" ? 9 : availH / H);
  const h = DEV === "desktop" ? Math.max(H, availH / s) : H;
  dev.className = "device " + DEV;
  dev.style.width = W + "px"; dev.style.height = h + "px"; dev.style.transform = `scale(${s})`;
  dev.style.marginBottom = (h * s - h) + "px";
}
addEventListener("resize", layoutDevice);
document.querySelectorAll("[data-dev]").forEach(b => b.addEventListener("click", () => { DEV = b.dataset.dev; document.querySelectorAll("[data-dev]").forEach(x => x.setAttribute("aria-pressed", x === b)); layoutDevice(); }));

/* sortable list helper: items rendered with head + optional body */
function list(path, {head, body, add, addLabel, chips, toggleShow}){
  const arr = get(path) || [];
  const items = arr.map((it,i) => {
    if (chips) return `<div class="chip" data-i="${i}"><span class="grip">${ICON.grip}</span>${chips(it,i)}<button class="mini del" type="button" data-act="del" data-list="${path}" data-i="${i}" title="Remove">${ICON.del}</button></div>`;
    const open = OPEN[path] === i;
    const hidden = toggleShow && it.show === false;
    return `<div class="item ${hidden?"off":""}" data-i="${i}" data-item="${path}.${i}">
      <div class="ihead"><span class="grip" title="Drag to reorder">${ICON.grip}</span>${head(it,i)}
        ${toggleShow?`<button class="mini" type="button" data-act="show" data-list="${path}" data-i="${i}" title="${hidden?"Show":"Hide"}">${hidden?ICON.eyeOff:ICON.eye}</button>`:""}
        <button class="mini" type="button" data-act="dup" data-list="${path}" data-i="${i}" title="Duplicate">${ICON.dup}</button>
        <button class="mini del" type="button" data-act="del" data-list="${path}" data-i="${i}" title="Delete">${ICON.del}</button></div>
      ${open && body ? `<div class="ibody">${body(it,i)}</div>` : ""}</div>`;
  }).join("");
  return `<div class="${chips?"chips":"list"}" data-sort="${path}">${items}</div>${add?`<button class="add" type="button" data-act="add" data-list="${path}">${ICON.plus}${addLabel||"Add"}</button>`:""}`;
}

let pickTarget = null;

async function takeImage(p, file){
  try {
    const isHero = p === "hero.photo";
    const url = await shrink(file, isHero ? 1100 : 1600, isHero ? 2200 : 1400);
    const key = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    PENDING[key] = url; set(p, "pending:" + key); changed({now:true}); renderPanel(); toast("Image added. It goes live when you publish.");
  } catch(err) { toast("Couldn't read that image. Try a JPG, PNG or WebP.", true); }
}
async function shrink(file, maxW, maxH){
  const bmp = await createImageBitmap(file);
  const s = Math.min(1, maxW / bmp.width, maxH / bmp.height);
  const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width * s); cv.height = Math.round(bmp.height * s);
  cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
  let url = cv.toDataURL("image/webp", .86);
  if (!url.startsWith("data:image/webp")) url = cv.toDataURL(file.type === "image/png" ? "image/png" : "image/jpeg", .88);
  return url;
}

function ghCfg(){
  let g = {}; try { g = JSON.parse(LS.get(GH_KEY) || sessionStorage.getItem(GH_KEY) || "{}"); } catch(_) {}
  return {owner: g.owner || "MustafaAswany", repo: g.repo || "MustafaAswany.github.io", branch: g.branch || "main", token: g.token || "", remember: g.remember !== false};
}
function saveGh(){
  const t = $("#ghToken"); if (!t) return;
  const g = {owner: $("#ghOwner").value.trim(), repo: $("#ghRepo").value.trim(), branch: "main", token: t.value.trim(), remember: $("#ghRemember").checked};
  LS.del(GH_KEY); try { sessionStorage.removeItem(GH_KEY); } catch(_) {}
  if (g.remember) LS.set(GH_KEY, JSON.stringify(g)); else try { sessionStorage.setItem(GH_KEY, JSON.stringify(g)); } catch(_) {}
}
let publishing = false;
async function publish(){
  if (publishing) return;
  const g = ghCfg();
  if (!g.token) { openTab("publish"); toast("Paste your GitHub token first (steps on the left)", true); return; }
  publishing = true; const btn = $("#publishBtn"); btn.disabled = true; btn.lastChild.textContent = "Publishing…";
  const logEl = $("#pubLog"); const log = m => { if (logEl) { logEl.hidden = false; logEl.textContent += m + "\n"; logEl.scrollTop = 1e9; } };
  if (logEl) logEl.textContent = "";
  const api = async (path, opts = {}) => {
    const r = await fetch(`https://api.github.com/repos/${g.owner}/${g.repo}${path}`, {...opts, headers: {"Authorization": `Bearer ${g.token}`, "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", ...(opts.body ? {"Content-Type":"application/json"} : {})}});
    if (!r.ok) { const body = await r.json().catch(() => ({})); const e = new Error(body.message || r.statusText); e.status = r.status; throw e; }
    return r.json();
  };
  try {
    log("Connecting to GitHub…");
    const ref = await api(`/git/ref/heads/${g.branch}`);
    const head = await api(`/git/commits/${ref.object.sha}`);
    const out = clone(C), tree = [];
    const keys = new Set(); JSON.stringify(out, (k,v) => { if (typeof v === "string" && v.startsWith("pending:")) keys.add(v.slice(8)); return v; });
    const paths = {};
    for (const key of keys) {
      const dataUrl = PENDING[key]; if (!dataUrl) continue;
      const ext = (dataUrl.match(/^data:image\/(\w+)/) || [,"webp"])[1].replace("jpeg","jpg");
      const p = `img/u-${key}.${ext}`;
      log("Uploading image " + p + "…");
      const blob = await api(`/git/blobs`, {method:"POST", body: JSON.stringify({content: dataUrl.split(",")[1], encoding:"base64"})});
      tree.push({path:p, mode:"100644", type:"blob", sha: blob.sha}); paths[key] = p;
    }
    const fin = JSON.parse(JSON.stringify(out), (k,v) => typeof v === "string" && v.startsWith("pending:") ? (paths[v.slice(8)] || "") : v);
    const json = JSON.stringify(fin, null, 2) + "\n";
    log("Saving content…");
    const cb = await api(`/git/blobs`, {method:"POST", body: JSON.stringify({content: json, encoding:"utf-8"})});
    tree.push({path:"content.json", mode:"100644", type:"blob", sha: cb.sha});
    const nt = await api(`/git/trees`, {method:"POST", body: JSON.stringify({base_tree: head.tree.sha, tree})});
    const msg = ($("#pubMsg") && $("#pubMsg").value.trim()) || "Update portfolio from editor";
    const nc = await api(`/git/commits`, {method:"POST", body: JSON.stringify({message: msg, tree: nt.sha, parents: [ref.object.sha]})});
    await api(`/git/refs/heads/${g.branch}`, {method:"PATCH", body: JSON.stringify({sha: nc.sha})});
    C = fin; PENDING = {}; PUBLISHED = JSON.stringify(C); lastSnap = PUBLISHED; LS.del(DRAFT_KEY);
    log("Done. The live site updates in about a minute.");
    toast("Published! The live site updates in about a minute.");
    sendPreview(); setStatus(); if (TAB !== "publish") renderPanel();
  } catch(err) {
    let diag = "";
    if (err.status === 403 || err.status === 404) {
      try {
        const r = await fetch(`https://api.github.com/repos/${g.owner}/${g.repo}`, {headers:{"Authorization":`Bearer ${g.token}`,"Accept":"application/vnd.github+json"}});
        if (r.status === 404) diag = "The token can't see the repository. On GitHub, edit the token → Repository access → Only select repositories → add MustafaAswany.github.io → Update.";
        else if (r.ok) { const j = await r.json(); diag = j.permissions && j.permissions.push === false ? "The token is read-only. On GitHub, edit the token → Permissions → Repository → Contents → Read and write → Update." : ""; }
      } catch(_) {}
    }
    const m = err.status === 401 ? "GitHub didn't accept the token. Create a new one and paste it again."
      : diag ? diag
      : err.status === 403 || err.status === 404 ? "The token can't write to this repository. Check it has Contents: Read and write on MustafaAswany.github.io."
      : err.status === 409 || err.status === 422 ? "The site changed on GitHub at the same time. Click Publish again."
      : "Couldn't publish: " + err.message;
    log("✕ " + m); toast(m, true); openTab("publish");
  } finally {
    publishing = false; btn.disabled = false; btn.lastChild.textContent = "Publish";
  }
}
$("#publishBtn").addEventListener("click", () => { if (TAB === "publish" && $("#ghToken")) saveGh(); publish(); });

/* keyboard */
addEventListener("keydown", e => {
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === "z" && !["INPUT","TEXTAREA"].includes(document.activeElement.tagName)) { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  if (mod && e.key.toLowerCase() === "s") { e.preventDefault(); saveDraft(); toast("Draft saved on this computer"); }
});
$("#undo").addEventListener("click", undo); $("#redo").addEventListener("click", redo);
addEventListener("beforeunload", e => { if (Object.keys(PENDING).length && JSON.stringify(C) !== PUBLISHED) { e.preventDefault(); e.returnValue = ""; } });

/* ===================== password lock ===================== */
let LOCK = null; const UNLOCK_KEY = "aswany-editor-unlock";
const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,"0")).join("");
async function derive(pw, salt, iter){
  const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return hex(await crypto.subtle.deriveBits({name:"PBKDF2", hash:"SHA-256", salt: new TextEncoder().encode(salt), iterations: iter}, key, 256));
}
async function loadLock(){
  try { const r = await fetch("editor-lock.json?v=" + Date.now(), {cache:"no-store"}); if (r.ok) LOCK = await r.json(); } catch(_) {}
}
function unlocked(){
  if (!LOCK) return true;
  try { const u = JSON.parse(LS.get(UNLOCK_KEY) || sessionStorage.getItem(UNLOCK_KEY) || "null"); return !!u && u.h === LOCK.hash && (!u.exp || u.exp > Date.now()); } catch(_) { return false; }
}
function showLock(){
  return new Promise(res => {
    $("#lock").hidden = false; setTimeout(() => $("#lockPw").focus(), 50);
    $("#lockForm").onsubmit = async e => {
      e.preventDefault(); $("#lockErr").textContent = ""; $("#lockGo").disabled = true; $("#lockGo").textContent = "Checking…";
      const h = await derive($("#lockPw").value, LOCK.salt, LOCK.iter || 210000);
      $("#lockGo").disabled = false; $("#lockGo").textContent = "Unlock";
      if (h !== LOCK.hash) { $("#lockErr").textContent = "Wrong password. Try again."; $("#lockPw").select(); return; }
      const rec = JSON.stringify({h, exp: Date.now() + 30*864e5});
      if ($("#lockRemember").checked) LS.set(UNLOCK_KEY, rec); else try { sessionStorage.setItem(UNLOCK_KEY, rec); } catch(_) {}
      $("#lock").hidden = true; res();
    };
  });
}
async function setPassword(){
  const a = $("#pw1").value, b = $("#pw2").value, g = ghCfg();
  if (a.length < 8) return toast("Use at least 8 characters", true);
  if (a !== b) return toast("The two passwords don't match", true);
  if (!g.token) return toast("Connect GitHub first (section above)", true);
  const salt = hex(crypto.getRandomValues(new Uint8Array(16))), iter = 210000;
  const hash = await derive(a, salt, iter);
  const body = JSON.stringify({salt, iter, hash}) + "\n";
  const url = `https://api.github.com/repos/${g.owner}/${g.repo}/contents/editor-lock.json`;
  const H = {"Authorization": `Bearer ${g.token}`, "Accept": "application/vnd.github+json"};
  try {
    let sha; const ex = await fetch(url + "?ref=" + g.branch, {headers:H, cache:"no-store"}); if (ex.ok) sha = (await ex.json()).sha;
    const r = await fetch(url, {method:"PUT", headers:{...H, "Content-Type":"application/json"}, body: JSON.stringify({message: LOCK ? "Change editor password" : "Lock editor with a password", content: btoa(body), branch: g.branch, ...(sha ? {sha} : {})})});
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).message || r.status);
    LOCK = {salt, iter, hash}; LS.set(UNLOCK_KEY, JSON.stringify({h: hash, exp: Date.now() + 30*864e5}));
    toast("Password set. Others will see a lock screen in about a minute."); renderPanel();
  } catch(err) { toast("Couldn't save the password: " + err.message, true); }
}

/* ===================== boot ===================== */
(async function boot(){
  await loadLock();
  if (!unlocked()) await showLock();
  document.body.classList.remove("locked");
  renderTabs(); layoutDevice();
  let live = null;
  try { const r = await fetch("content.json?v=" + Date.now(), {cache:"no-store"}); if (r.ok) live = await r.json(); } catch(_) {}
  if (!live) { $("#panel").innerHTML = `<div class="banner"><p>Couldn't load content.json. Open the editor from the published site (mustafaaswany.github.io/editor.html).</p></div>`; return; }
  PUBLISHED = JSON.stringify(live); C = live;
  try {
    const d = JSON.parse(LS.get(DRAFT_KEY) || "null");
    if (d && d.C && JSON.stringify(d.C) !== PUBLISHED) {
      C = d.C; PENDING = d.PENDING || {};
      const when = new Date(d.at).toLocaleString();
      window.__draftNote = `Loaded your unpublished changes from ${esc(when)}.`;
    }
  } catch(_) {}
  lastSnap = JSON.stringify(C);
  renderPanel(); setStatus(); sendPreview(); updUndo();
})();
</script>
